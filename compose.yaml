name: netlab

networks:
  labnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  scanner:
    build: ./scanner
    command: ["sleep", "infinity"]
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      labnet:
        ipv4_address: 172.30.0.5

  web:
    image: nginx:alpine
    volumes:
      - ./nginx/security.conf:/etc/nginx/conf.d/security.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      labnet:
        ipv4_address: 172.30.0.10

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${LAB_REDIS_PASSWORD:?LAB_REDIS_PASSWORD must be set}", "--protected-mode", "yes"]
    networks:
      labnet:
        ipv4_address: 172.30.0.20

  app:
    image: flask-app:hardened
    environment:
      SECRET_KEY: ${LAB_SECRET_KEY:?LAB_SECRET_KEY must be set}
    networks:
      labnet:
        ipv4_address: 172.30.0.40